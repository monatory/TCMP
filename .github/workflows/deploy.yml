name: Deploy to GitHub Pages

# 2026-10-07: TCMP 운영은 https://tcmp-eb8ab.web.app (Firebase, 응답 중앙 수집)으로 이전.
# 이 Pages 주소(monatory.github.io/TCMP)는 예전 QR·링크가 계속 쓰이므로,
# 앱을 빌드하지 않고 redirect/ 의 넘겨주기 페이지만 배포해 모든 접속을 새 주소로 보낸다
# (진단 → web.app/?ch=QR-LEGACY, 관리자 → web.app/admin/).
# 예전 앱 배포로 되돌리려면 이 커밋을 revert 하면 된다.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (넘겨주기 페이지만)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
